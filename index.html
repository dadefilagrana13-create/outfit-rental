<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Outfit Rental</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/><style>body{font-family:'Inter',sans-serif;}</style></head><script src="config.js"></script>
<body class="bg-gray-950 text-white min-h-screen"><nav class="border-b border-gray-800 px-6 py-4 flex items-center justify-between"><div class="flex items-center gap-2"><span class="text-2xl">👗</span><span class="font-bold text-xl">Outfit Rental</span></div><div class="flex gap-2"><button onclick="showTab('plan')" class="tab-btn px-3 py-2 rounded-lg text-sm bg-indigo-600 text-white" data-tab="plan">Plan Trip</button><button onclick="showTab('bookings')" class="tab-btn px-3 py-2 rounded-lg text-sm text-gray-400" data-tab="bookings">Bookings</button></div></nav><div id="tab-plan" class="p-6 max-w-3xl mx-auto"><h1 class="text-3xl font-black mb-2">Pack light. Dress perfectly. ✈️</h1><p class="text-gray-400 mb-6">Tell us your destination — get a curated wardrobe.</p><div class="grid grid-cols-2 gap-6"><div class="space-y-4 bg-gray-900 border border-gray-800 rounded-xl p-5"><input id="t-destination" type="text" placeholder="Destination (e.g. Santorini, Greece)" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm"/><div class="grid grid-cols-2 gap-2"><input id="t-from" type="date" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm"/><input id="t-to" type="date" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm"/></div><select id="t-occasion" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm"><option>Beach & Leisure</option><option>City Exploration</option><option>Business Trip</option><option>Wedding / Formal</option><option>Luxury Resort</option></select><select id="t-style" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm"><option>Casual Chic</option><option>Elegant</option><option>Streetwear</option><option>Minimalist</option><option>Boho</option></select><button onclick="generateWardrobe()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-xl font-bold">✨ Generate Wardrobe</button></div><div id="wardrobe-result" class="bg-gray-900 border border-gray-800 rounded-xl p-5 min-h-64"><p class="text-gray-500 text-sm">Your curated wardrobe will appear here... 👗</p></div></div></div><div id="tab-bookings" class="p-6 hidden max-w-2xl"><h1 class="text-2xl font-bold mb-4">My Trip Plans 📦</h1><div id="bookings-list" class="space-y-3"></div></div><script>const SUPABASE_URL='https://nmulrsbqdeqokvrybapn.supabase.co';const SUPABASE_KEY=window.APP_CONFIG?.SUPABASE_KEY||'';const GROQ_KEY=window.APP_CONFIG?.GROQ_KEY||'';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);function showTab(tab){document.querySelectorAll('[id^="tab-"]').forEach(el=>el.classList.add('hidden'));document.getElementById('tab-'+tab).classList.remove('hidden');document.querySelectorAll('.tab-btn').forEach(btn=>{btn.classList.remove('bg-indigo-600','text-white');btn.classList.add('text-gray-400');});const a=document.querySelector(`[data-tab="${tab}"]`);a.classList.add('bg-indigo-600','text-white');a.classList.remove('text-gray-400');if(tab==='bookings')loadBookings();}async function generateWardrobe(){const dest=document.getElementById('t-destination').value,from=document.getElementById('t-from').value,to=document.getElementById('t-to').value,occasion=document.getElementById('t-occasion').value,style=document.getElementById('t-style').value,el=document.getElementById('wardrobe-result');el.innerHTML='<p class="text-indigo-400 animate-pulse">✨ Curating wardrobe...</p>';const days=from&&to?Math.ceil((new Date(to)-new Date(from))/86400000)+' days':'';const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':`Bearer ${GROQ_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:`Create a travel wardrobe for: ${dest} (${days}), Occasion: ${occasion}, Style: ${style}. Include: outfit list, day-by-day suggestions, estimated rental cost, packing essentials. Be specific.`}],max_tokens:600})});const data=await res.json();el.innerHTML=`<pre class="whitespace-pre-wrap text-sm text-gray-200 font-sans">${data.choices[0].message.content}</pre>`;await sb.from('or_bookings').insert([{destination:dest,from_date:from||null,to_date:to||null,occasion,style,status:'Planning'}]);}async function loadBookings(){const{data}=await sb.from('or_bookings').select('*').order('created_at',{ascending:false});document.getElementById('bookings-list').innerHTML=(data||[]).map(b=>`<div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><h3 class="font-bold">✈️ ${b.destination}</h3><p class="text-sm text-gray-400">${b.from_date||'—'} → ${b.to_date||'—'}</p><p class="text-xs text-gray-500">${b.occasion} · ${b.style}</p></div>`).join('')||'<p class="text-gray-500">No plans yet.</p>';}</script></body></html>
